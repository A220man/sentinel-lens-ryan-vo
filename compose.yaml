services:
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_password_for_local_dev_only
      KC_HTTP_RELATIVE_PATH: /
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    user: "10001:10001"
    environment:
      ENVIRONMENT: development
      DEMO_MODE: "true"
      DATABASE_URL: "sqlite:////app/data/sentinel_lens.db"
      OIDC_ISSUER_URL: "http://keycloak:8080/realms/sentinel-lens"
      OIDC_CLIENT_ID: sentinel-lens-app
      OIDC_AUDIENCE: sentinel-lens-api
      LLM_API_KEY: ""
      LLM_PROVIDER: openai-compatible
      LLM_MODEL: gpt-4o-mini
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      keycloak:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    user: "10002:10002"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - backend

volumes:
  keycloak_data:
  backend_data:
